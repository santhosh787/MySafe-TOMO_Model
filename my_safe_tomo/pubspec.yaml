name: my_safe_tomo
description: A consent-based personal safety MVP built with Flutter and Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  google_sign_in: ^7.2.0
  geolocator: ^13.0.2
  sensors_plus: ^6.0.1
  connectivity_plus: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
